<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="app" aria-label="Tic-Tac-Toe game">
    <h1>Tic-Tac-Toe</h1>
    <p class="sub">Two players, same device. X goes first.</p>

    <div class="topbar">
      <div class="status" aria-live="polite" aria-atomic="true" id="status">
        <strong>Turn:</strong> <span>X</span>
      </div>

      <div class="controls">
        <button id="confirmBtn" type="button">Confirm Move</button>
        <button id="restartBtn" type="button">Restart</button>
      </div>
    </div>

    <div class="hint" id="selectionText" aria-live="polite">
      Selected: none
    </div>

    <section
      class="board"
      role="grid"
      aria-label="3 by 3 Tic-Tac-Toe board"
      id="board"
      tabindex="0"
    >
      <!-- Cells created by script.js -->
    </section>

    <div class="footer">
      <div><strong>Mouse:</strong> click a square to select, then Confirm.</div>
      <div><strong>Keyboard:</strong> arrows = move, Enter/Space = confirm, R = restart</div>
      <div id="helperText">Select a square, then confirm your move.</div>
    </div>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
